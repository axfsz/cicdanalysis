[project]
name = "cicdanalysis"
version = "0.8.0"
description = "Jenkins build intelligence and Telegram reporting"
requires-python = ">=3.11"
dependencies = ["psycopg[binary]>=3.2,<4"]

[project.optional-dependencies]
telegram-user = ["telethon>=1.36,<2"]

[tool.setuptools]
packages = ["cicdanalysis"]
