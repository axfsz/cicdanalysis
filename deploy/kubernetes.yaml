apiVersion: v1
kind: Namespace
metadata:
  name: cicd-analysis
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: cicdanalysis
  namespace: cicd-analysis
data:
  APP_TIMEZONE: Asia/Kuala_Lumpur
  JENKINS_URL: https://ugjekins.ugmid888.com
  JENKINS_USER: cicd-analysis
  JENKINS_VERIFY_TLS: "true"
  JENKINS_POLL_SECONDS: "60"
  JENKINS_INITIAL_BUILD_LIMIT: "20"
  JENKINS_CONSOLE_HEAD_BYTES: "65536"
  JENKINS_SERVICE_USERS: "ugadmin,cicd-analysis,anonymous"
  TELEGRAM_LISTEN_GROUP_MESSAGES: "true"
  TELEGRAM_POLL_TIMEOUT: "30"
  TELEGRAM_TESTA_CHAT_ID: "-1003919548725"
  TELEGRAM_UAT_CHAT_ID: "-5592801576"
  TELEGRAM_PROD_CHAT_ID: "-1003412281586"
  REPORT_DAILY_HOUR: "9"
  REPORT_DAILY_MINUTE: "0"
  REPORT_WEEKLY_WEEKDAY: "0"
  REPORT_MONTHLY_DAY: "1"
---
apiVersion: v1
kind: Secret
metadata:
  name: cicdanalysis-secrets
  namespace: cicd-analysis
type: Opaque
stringData:
  JENKINS_API_TOKEN: REPLACE_ME
  TELEGRAM_BOT_TOKEN: REPLACE_ME
  WEBHOOK_SECRET: REPLACE_WITH_LONG_RANDOM_VALUE
  TRIGGER_WEBHOOK_SECRET: REPLACE_WITH_DIFFERENT_LONG_RANDOM_VALUE
  READ_API_TOKEN: REPLACE_WITH_ANOTHER_LONG_RANDOM_VALUE  # dashboard / GET /api/v1/*
  DATABASE_URL: postgresql://USER:PASSWORD@POSTGRES_HOST:5432/cicdanalysis
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cicdanalysis
  namespace: cicd-analysis
  labels: {app: cicdanalysis}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels: {app: cicdanalysis}
  template:
    metadata:
      labels: {app: cicdanalysis}
    spec:
      securityContext:
        fsGroup: 10001
      containers:
        - name: cicdanalysis
          image: harbor.ugmid888.com/REPLACE_PROJECT/cicdanalysis:0.7.4
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef: {name: cicdanalysis}
            - secretRef: {name: cicdanalysis-secrets}
          ports:
            - {name: http, containerPort: 8080}
          readinessProbe:
            httpGet: {path: /readyz, port: http}
            initialDelaySeconds: 5
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            initialDelaySeconds: 15
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: 1000m, memory: 512Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: cicdanalysis
  namespace: cicd-analysis
  labels: {app: cicdanalysis}
spec:
  selector: {app: cicdanalysis}
  ports:
    - {name: http, port: 8080, targetPort: http}
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: cicdanalysis
  namespace: cicd-analysis
  labels: {release: monitor}
spec:
  selector:
    matchLabels: {app: cicdanalysis}
  namespaceSelector:
    matchNames: [cicd-analysis]
  endpoints:
    - {port: http, path: /metrics, interval: 30s}
